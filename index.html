<!DOCTYPE html>

<html lang="pt">
<head>
  <title>Calculadora</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!---Primeira Divisão--->
  <main>
   <div class="bar">
    <input type="text" id="display" disabled>
    <button id="delete" value="⌫">⌫</button>
   </div>
   <div class="calculator">
     <div class="numbers">
       <button value="1">1</button>
       <button value="2">2</button>
       <button value="3">3</button>
       <button value="4">4</button>
       <button value="5">5</button>
       <button value="6">6</button>
       <button value="7">7</button>
       <button value="8">8</button>
       <button value="9">9</button>
       <button id="AC" value="C">C</button>
         <button value="0">0</button>
         <button id="equal" value="=">=</button>
     </div>

     <div class="operadores">
      <button value="÷">÷</button>
      <button value="*">×</button>
      <button value="-">-</button>
      <button value="+">+</button>
     </div>
   </div>
  </main>
    <footer class="footer">
    <p>Calculadora simples</p>
    <button onclick="mudarTema()" id="change">Mudar Tema</button>

    <div class="footer-links">
      <span>Botões de operações básicas</span>
      <span>Modo claro e escuro</span>
      <span>HTML • CSS • JavaScript</span>
    </div>

    <p class="autor">© 2026 Celestino</p>
  </footer>
<script src="script.js"></script>
</body>
</html>
